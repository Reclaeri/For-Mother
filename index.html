<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#24180f" />
    <title>For Mother</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="boot.css" />
  </head>
  <body>
    <section id="boot-screen" class="mobile-boot" data-phase="team" aria-label="Memuat For Mother">
      <div class="mobile-boot-art" aria-hidden="true"></div>
      <div class="mobile-boot-shade" aria-hidden="true"></div>
      <div class="mobile-boot-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="mobile-boot-team">
        <img src="assets/Logo Tim.png" alt="Logo tim pengembang" />
        <p>SEBUAH PERSEMBAHAN DARI TIM KAMI</p>
      </div>
      <div class="mobile-boot-brand">
        <img src="assets/ui/logo_for_mother.png" alt="For Mother" fetchpriority="high" />
        <p>Untuk Ibu, selalu ada harapan.</p>
      </div>
      <div class="mobile-boot-loading">
        <div class="mobile-boot-label"><span id="boot-status" role="status">Menyiapkan perjalanan</span><span id="boot-percent">0%</span></div>
        <div class="mobile-boot-track" role="progressbar" aria-label="Memuat aset permainan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <p id="boot-message">Sebuah langkah kecil. Sebuah harapan besar.</p>
      </div>
      <button id="boot-skip" type="button">LEWATI INTRO <span aria-hidden="true">&#8594;</span></button>
    </section>
    <main id="game" aria-label="For Mother">
      <div id="viewport">
        <div id="scene">
          <img id="bg" alt="" />
          <div id="world"></div>
          <div id="fx"></div>
          <div id="debug"></div>
        </div>
        <div id="cleaning"></div>
        <div id="vignette"></div>
        <div id="ui"></div>
        <div id="dialog"></div>
        <div id="modal"></div>
        <div id="fade"></div>
      </div>
    </main>
    <script src="js/core/gameState.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/ui/cursor.js"></script>
    <script src="js/core/save.js"></script>
    <script src="js/player/collision.js"></script>
    <script src="js/core/difficulty.js"></script>
    <script src="js/player/movement.js"></script>
    <script src="js/systems/interaction.js"></script>
    <script src="js/systems/timer.js"></script>
    <script src="js/systems/dialog.js"></script>
    <script src="js/systems/inventory.js"></script>
    <script src="js/systems/cleaning.js"></script>
    <script src="js/systems/repair.js"></script>
    <script src="js/systems/restoration.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/ui/result.js"></script>
    <script src="js/ui/menu.js"></script>
    <script src="js/chapters/chapter1.js"></script>
    <script src="js/chapters/chapter2.js"></script>
    <script src="js/chapters/chapter3.js"></script>
    <script src="js/chapters/chapter4.js"></script>
    <script src="js/chapters/chapter5.js"></script>
    <script src="js/core/scene.js"></script>
    <script src="js/ui/boot.js"></script>
    <script src="script.js"></script>
  </body>
</html>
